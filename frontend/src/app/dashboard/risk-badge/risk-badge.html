@if (risk()) {
  <div class="risk-badge" [class]="risk()!.level.toLowerCase()">
    @switch (risk()!.level) {
      @case ('OK') {
        <svg class="risk-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" />
          <path d="M6 10.5l2.5 2.5 5.5-6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
      @case ('WARNING') {
        <svg class="risk-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2.5l8.5 14.5H1.5L10 2.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M10 8v3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          <circle cx="10" cy="14" r="0.9" fill="currentColor" />
        </svg>
      }
      @case ('ALERT') {
        <svg class="risk-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" />
          <path d="M10 5.5v5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          <circle cx="10" cy="14" r="0.9" fill="currentColor" />
        </svg>
      }
    }
    <div class="risk-text">
      <span class="risk-level">{{ risk()!.level }}</span>
      <span class="risk-message">{{ risk()!.message }}</span>
    </div>
  </div>
}
