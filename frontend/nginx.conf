server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No /api proxy here: the browser calls the backend directly at
    # config.json's apiBaseUrl (see AppConfigService), relying on the
    # backend's CORS config. Works identically in docker-compose and Render.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
